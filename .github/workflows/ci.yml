name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -w @ssreporter/presenter-onair

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Advisory only: see docs/dependency-security.md for the accepted
      # Node-only advisories (sharp via @huggingface/transformers).
      - name: Audit production dependencies (non-blocking)
        run: npm run audit:prod
        continue-on-error: true
